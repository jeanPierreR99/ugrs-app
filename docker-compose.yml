version: "3.9"

services:

  app:
    build: .
    container_name: ugrs-app
    restart: always
    depends_on:
      - ugrs-db
    ports:
      - "127.0.0.1:3006:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production

  ugrs-db:
    image: mysql:8
    container_name: ugrs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
